name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Check out Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: de322448ac435b720177b94496e51ae6c10ad543
          path: .hermes-agent-src
      - name: Create environment
        run: |
          uv venv
          uv pip install -e '.[dev]'
          uv pip install -e ./.hermes-agent-src
      - name: Test
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/.hermes-agent-src
        run: >-
          .venv/bin/python -m pytest -q
          --cov=basecamp_platform --cov-fail-under=80
